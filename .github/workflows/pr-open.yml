name: PR

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  vars:
    name: Variables
    runs-on: ubuntu-24.04
    outputs:
      slot: ${{ steps.calc.outputs.slot }}
    steps:
      - id: calc
        run: |
          slot=$(( ${{ github.event.number }} % 50 ))
          echo "slot=${slot}" >> "$GITHUB_OUTPUT"
          echo "PR ${{ github.event.number }} -> preview slot ${slot}"

  builds:
    name: Builds
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      attestations: write
      id-token: write
      packages: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [backend, frontend]
    timeout-minutes: 10
    steps:
      - uses: bcgov/action-builder-ghcr@de3d575cf158e16f5dc2789630f6d587483b911c # v4.4.0
        with:
          package: ${{ matrix.package }}
          tags: ${{ github.event.number }}
          tag_fallback: latest
          triggers: ('${{ matrix.package }}/', '.github/workflows/')

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 21.0.12 (Temurin) + Maven cache
        uses: actions/setup-java@v5
        with:
          java-version: "21.0.12"
          distribution: "temurin"
          cache: maven

      - name: Verify deployment and release controls
        run: node --test .github/scripts/*.test.mjs

      - name: Maven verify
        working-directory: backend
        run: mvn -B verify

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Quality checks
        working-directory: frontend
        run: |
          npm run typecheck
          npm run lint
          npm run format:check

      # Enforces the coverage thresholds in vitest.config.ts.
      - name: Unit tests with coverage
        working-directory: frontend
        run: npm run test:cov

  deploys:
    name: Deploys (${{ github.event.number }})
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: [builds, vars, backend-tests, frontend-tests]
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-deploy.yml
    secrets:
      oc_namespace: ${{ secrets.oc_namespace }}
      oc_token: ${{ secrets.oc_token }}
      database_user: ${{ secrets.database_user }}
      database_password: ${{ secrets.database_password }}
      database_host: ${{ secrets.database_host }}
      database_service_name: ${{ secrets.database_service_name }}
      keystore_secret: ${{ secrets.keystore_secret }}
    with:
      environment: dev
      target: ${{ github.event.number }}
      slot: ${{ needs.vars.outputs.slot }}
      backend_min_replicas: "1"
      backend_max_replicas: "1"
      frontend_replicas: "1"
      backend_cpu_request: "200m"
      backend_memory_request: "512Mi"
      backend_cpu_limit: "1000m"
      backend_memory_limit: "1Gi"
      triggers: ('backend/', 'frontend/', '.github/workflows/')

  tests:
    name: Tests
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.deploys.outputs.triggered == 'true'
    needs: [deploys, vars]
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-tests.yml
    with:
      target: ${{ github.event.number }}
      slot: ${{ needs.vars.outputs.slot }}

  results:
    name: PR Results
    needs: [builds, backend-tests, frontend-tests, deploys, tests]
    if: always()
    runs-on: ubuntu-slim
    steps:
      - uses: bcgov/actions/workflow-results@79aefe3a7abb2d0d00b1b3ea4cfbf12727a10638 # v0.9.0
        with:
          needs: ${{ toJson(needs) }}
